[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-diagnosis-agents"
version = "0.1.0"
description = "课程设计成员 D：规则诊断与固定三阶段协作演示"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.3",
    "pydantic==2.11.7",
    "httpx==0.28.1",
    "python-dotenv==1.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["diagnosis_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

